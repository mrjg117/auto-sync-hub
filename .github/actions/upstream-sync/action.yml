name: Upstream sync
description: 检查上游健康状态并自动更新 fork（ff 优先，冲突即停）

inputs:
  fork:
    description: 目标 fork，格式 owner/repo
    required: true
  upstream:
    description: 上游仓库，格式 owner/repo
    required: true
  branch:
    description: 上游分支，留空自动检测默认分支（main/master 均可）
    required: false
    default: ""
  fork-branch:
    description: fork 分支，留空自动检测默认分支
    required: false
    default: ""
  key-files:
    description: 可选：必须存在且非空的关键文件（空格分隔）；留空则不按文件名检查
    required: false
    default: ""
  protected-files:
    description: 可选：同步时强制保留 fork 本地版本的文件（空格分隔路径）；上游对这些文件的改动会被忽略，也不会因它们冲突
    required: false
    default: ""
  max-deleted:
    description: 单次允许删除的最大文件数
    required: false
    default: "50"
  max-delete-pct:
    description: 单次允许删除的最大百分比
    required: false
    default: "30"
  ci-gate:
    description: 是否检查上游候选提交 CI（仅拦截明确失败；无记录或读取失败均放行）
    required: false
    default: "true"
  follow-rename:
    description: 上游改名时自动跟随（用新 full_name 同步并回写 projects.json）；默认关闭，仅提示
    required: false
    default: "false"
  token:
    description: 用于推送到目标 fork 的 classic PAT（public_repo + workflow，私有仓库另加 repo）
    required: true
  read-token:
    description: 读取上游公开仓库状态与 check-runs 的 token
    required: true

runs:
  using: composite
  steps:
    - name: 克隆 fork 并检测分支
      shell: bash
      env:
        FORK: ${{ inputs.fork }}
        UPSTREAM: ${{ inputs.upstream }}
        FORK_BRANCH_INPUT: ${{ inputs.fork-branch }}
      run: |
        set -euo pipefail
        REPO="$RUNNER_TEMP/sync-repo"
        echo "SYNC_REPO=$REPO" >> "$GITHUB_ENV"
        git clone --quiet "https://github.com/${FORK}.git" "$REPO"
        cd "$REPO"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        FB="$FORK_BRANCH_INPUT"
        [ -n "$FB" ] || FB=$(git rev-parse --abbrev-ref HEAD)
        echo "SYNC_FORK_BRANCH=$FB" >> "$GITHUB_ENV"
        echo "SYNC_FORK_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        git remote add upstream "https://github.com/${UPSTREAM}.git"
        git fetch --no-tags --quiet upstream || echo "upstream fetch failed"

    - name: 上游状态与 CI 门禁
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.read-token }}
        UPSTREAM: ${{ inputs.upstream }}
        BRANCH_INPUT: ${{ inputs.branch }}
        CI_GATE: ${{ inputs.ci-gate }}
        FOLLOW_RENAME: ${{ inputs.follow-rename }}
        FORK: ${{ inputs.fork }}
        STATE_FILE: .github/upstream-sync-state
      run: |
        set -uo pipefail
        cd "$SYNC_REPO"
        skip() {
          local msg="${1//$'\n'/ }"
          echo "SYNC_RESULT=skip" >> "$GITHUB_ENV"
          echo "- ${FORK}：跳过 — ${msg}" >> "$GITHUB_STEP_SUMMARY"
          echo "SKIP: $msg"
          exit 0
        }
        fail() {
          echo "SYNC_RESULT=error" >> "$GITHUB_ENV"
          echo "SYNC_ERROR=${1//$'\n'/ }" >> "$GITHUB_ENV"
          echo "::error::${FORK}: $1"
          exit 1
        }

        if ! gh api "repos/${UPSTREAM}" > repo.json 2>repo.err; then
          if grep -Eq 'HTTP 404|Not Found' repo.err; then
            skip "上游仓库已删除、转为私有或改名（API 404），未修改任何文件。"
          fi
          fail "无法读取上游仓库状态（API 失败），未修改任何文件。"
        fi
        FULL=$(jq -r '.full_name' repo.json)
        if [ "${FULL,,}" != "${UPSTREAM,,}" ] && [ "$FOLLOW_RENAME" != "true" ]; then
          skip "上游仓库已改名（full_name=$FULL）。如需自动跟随请在配置中设 follow_rename=true。"
        fi
        EFFECTIVE="$UPSTREAM"
        if [ "${FULL,,}" != "${UPSTREAM,,}" ]; then
          EFFECTIVE="$FULL"
          echo "上游已改名：$UPSTREAM -> $FULL，自动跟随。"
          git remote set-url upstream "https://github.com/${EFFECTIVE}.git"
          git fetch --no-tags --quiet upstream || fail "改名后无法 fetch 新仓库"
          echo "SYNC_RENAMED=1" >> "$GITHUB_ENV"
          echo "SYNC_RENAMED_TO=$FULL" >> "$GITHUB_ENV"
        fi
        echo "SYNC_EFFECTIVE_UPSTREAM=$EFFECTIVE" >> "$GITHUB_ENV"
        # 归档只提示不跳过：归档仓库仍可 fetch，最后一个提交仍需同步
        [ "$(jq -r '.archived' repo.json)" = "false" ] || echo "注意：上游仓库已归档（只读），继续检查更新。"
        # 禁用表示 git 访问受限，无法同步
        [ "$(jq -r '.disabled' repo.json)" = "false" ] || skip "上游仓库已被禁用（git 访问受限），跳过。"

        UB="$BRANCH_INPUT"
        [ -n "$UB" ] || UB=$(jq -r '.default_branch // empty' repo.json)
        [ -n "$UB" ] || fail "无法确定上游默认分支"
        CANDIDATE=$(git rev-parse "refs/remotes/upstream/${UB}" 2>/dev/null || true)
        [ -n "$CANDIDATE" ] || fail "无法解析上游 HEAD（${UB}）"
        git cat-file -e "${CANDIDATE}^{commit}" 2>/dev/null || fail "候选提交不可达"
        echo "SYNC_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
        echo "SYNC_BRANCH=$UB" >> "$GITHUB_ENV"

        if git merge-base --is-ancestor "$CANDIDATE" HEAD; then
          skip "fork 已包含上游最新提交 ${CANDIDATE:0:7}，无需同步。"
        fi

        LAST_SHA=$(sed -n 's/^sha=//p' "$STATE_FILE" 2>/dev/null || true)
        if [ -n "$LAST_SHA" ] && ! git merge-base --is-ancestor "$LAST_SHA" "$CANDIDATE" 2>/dev/null; then
          fail "上游历史被改写（上次同步点 ${LAST_SHA:0:7} 不在当前历史）"
        fi

        # CI 仅用于发现明确失败；无记录或读取失败都放行，不阻断同步
        if [ "$CI_GATE" = "true" ]; then
          if ! gh api "repos/${EFFECTIVE}/commits/${CANDIDATE}/check-runs?per_page=100" > checks.json 2>ci.err; then
            echo "注意：无法读取上游 CI（API 失败），跳过 CI 检查，继续同步。"
          else
            COUNT=$(jq -r '.total_count // 0' checks.json)
            if [ "$COUNT" -eq 0 ]; then
              echo "注意：上游该提交没有 CI 检查记录，跳过 CI 检查，继续同步。"
            else
              BAD=$(jq -r '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "error" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .name] | join(", ")' checks.json)
              [ -z "$BAD" ] || skip "上游当前版本 CI 明确失败：$BAD。"
            fi
          fi
        fi

        echo "SYNC_RESULT=ok" >> "$GITHUB_ENV"
        echo "SYNC_CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
        echo "SYNC_LAST_SHA=$LAST_SHA" >> "$GITHUB_ENV"
        echo "门禁通过：$CANDIDATE（分支 $UB）"

    - name: 内容检查
      if: env.SYNC_RESULT == 'ok'
      shell: bash
      env:
        KEY_FILES: ${{ inputs.key-files }}
        MAX_DELETED: ${{ inputs.max-deleted }}
        MAX_DELETE_PCT: ${{ inputs.max-delete-pct }}
        STATE_FILE: .github/upstream-sync-state
        FORK: ${{ inputs.fork }}
      run: |
        set -euo pipefail
        err() {
          echo "SYNC_RESULT=error" >> "$GITHUB_ENV"
          echo "SYNC_ERROR=${1//$'\n'/ }" >> "$GITHUB_ENV"
          echo "::error::${FORK}: $1"
          exit 1
        }
        cd "$SYNC_REPO"
        if [ -n "$KEY_FILES" ]; then
          for f in $KEY_FILES; do
            git cat-file -e "${SYNC_CANDIDATE}:${f}" 2>/dev/null || err "缺少关键文件 $f"
            SZ=$(git cat-file -s "${SYNC_CANDIDATE}:${f}" 2>/dev/null || echo 0)
            [ "$SZ" -gt 0 ] || err "关键文件 $f 为空"
          done
        fi
        TOTAL=$(git ls-tree -r --name-only "$SYNC_CANDIDATE" | wc -l | tr -d ' ')
        BYTES=$(git ls-tree -r -l "$SYNC_CANDIDATE" | awk '$2=="blob"{s+=$4} END{print s+0}')
        [ "$TOTAL" -gt 0 ] || err "候选树文件数为 0"
        BASE="${SYNC_LAST_SHA:-HEAD}"
        DELETED=$(git diff --name-status "$BASE..$SYNC_CANDIDATE" | grep -c '^D' || true)
        LAST_COUNT=$(sed -n 's/^files=//p' "$STATE_FILE" 2>/dev/null || true)
        LAST_BYTES=$(sed -n 's/^bytes=//p' "$STATE_FILE" 2>/dev/null || true)
        echo "文件 $TOTAL 个 / $BYTES 字节，删除 $DELETED"

        [ "$DELETED" -le "$MAX_DELETED" ] || err "删除 $DELETED 个文件，超过 $MAX_DELETED"
        if [ -n "$LAST_COUNT" ] && [ "$LAST_COUNT" -gt 0 ]; then
          [ $((TOTAL * 2)) -ge "$LAST_COUNT" ] || err "文件数腰斩 $LAST_COUNT → $TOTAL"
          PCT=$((DELETED * 100 / LAST_COUNT))
          [ "$PCT" -le "$MAX_DELETE_PCT" ] || err "删除比例 ${PCT}% 超过 ${MAX_DELETE_PCT}%"
        fi
        if [ -n "$LAST_BYTES" ] && [ "$LAST_BYTES" -gt 0 ]; then
          [ $((BYTES * 2)) -ge "$LAST_BYTES" ] || err "内容腰斩 $LAST_BYTES → $BYTES 字节"
        fi
        echo "SYNC_TOTAL=$TOTAL" >> "$GITHUB_ENV"
        echo "SYNC_BYTES=$BYTES" >> "$GITHUB_ENV"

    - name: 试合并检测冲突
      if: env.SYNC_RESULT == 'ok'
      shell: bash
      env:
        FORK: ${{ inputs.fork }}
        PROTECTED_FILES: ${{ inputs.protected-files }}
      run: |
        set -euo pipefail
        err() {
          echo "SYNC_RESULT=error" >> "$GITHUB_ENV"
          echo "SYNC_ERROR=${1//$'\n'/ }" >> "$GITHUB_ENV"
          echo "::error::${FORK}: $1"
          exit 1
        }
        cd "$SYNC_REPO"
        if git merge-base --is-ancestor HEAD "$SYNC_CANDIDATE"; then
          echo "SYNC_MODE=ff" >> "$GITHUB_ENV"
          exit 0
        fi
        git merge --no-commit --no-ff "$SYNC_CANDIDATE" >/dev/null 2>&1 || true
        # 受保护文件强制恢复 fork 原始版本（顺带消解这些文件的冲突）
        for f in $PROTECTED_FILES; do
          if git cat-file -e "${SYNC_FORK_HEAD}:${f}" 2>/dev/null; then
            git checkout "$SYNC_FORK_HEAD" -- "$f" 2>/dev/null || true
          fi
        done
        CONFLICTS=$(git diff --name-only --diff-filter=U || true)
        git merge --abort 2>/dev/null || true
        [ -z "$CONFLICTS" ] || err "合并冲突：$CONFLICTS，未推送"
        echo "SYNC_MODE=merge" >> "$GITHUB_ENV"

    - name: 合并、记录状态并推送
      if: env.SYNC_RESULT == 'ok'
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        UPSTREAM: ${{ inputs.upstream }}
        FORK: ${{ inputs.fork }}
        PROTECTED_FILES: ${{ inputs.protected-files }}
        STATE_FILE: .github/upstream-sync-state
      run: |
        set -euo pipefail
        err() {
          echo "SYNC_RESULT=error" >> "$GITHUB_ENV"
          echo "SYNC_ERROR=${1//$'\n'/ }" >> "$GITHUB_ENV"
          echo "::error::${FORK}: $1"
          exit 1
        }
        cd "$SYNC_REPO"
        mkdir -p "$(dirname "$STATE_FILE")"
        if [ "$SYNC_MODE" = "ff" ]; then
          git merge --ff-only "$SYNC_CANDIDATE"
        else
          git merge --no-commit --no-ff "$SYNC_CANDIDATE"
        fi
        # 受保护文件恢复为 fork 原始版本（仅 merge 模式；ff 表示 fork 无本地改动，直接跟随上游）
        KEPT=""
        if [ "$SYNC_MODE" != "ff" ]; then
          for f in $PROTECTED_FILES; do
            if git cat-file -e "${SYNC_FORK_HEAD}:${f}" 2>/dev/null; then
              git checkout "$SYNC_FORK_HEAD" -- "$f" 2>/dev/null || true
              KEPT="$KEPT $f"
              echo "已保留本地配置：$f"
            fi
          done
        fi
        printf 'sha=%s\nfiles=%s\nbytes=%s\n' "$SYNC_CANDIDATE" "$SYNC_TOTAL" "$SYNC_BYTES" > "$STATE_FILE"
        git add -A
        MSG="chore: auto-sync from ${UPSTREAM}@${SYNC_CANDIDATE:0:7}"
        git commit -m "$MSG" || echo "无改动，跳过 commit"
        git push "https://x-access-token:${TOKEN}@github.com/${FORK}.git" "HEAD:refs/heads/${SYNC_FORK_BRANCH}" || err "推送到 fork 失败（请检查 PAT 权限）"
        # 供 hub 层写日志使用的结构化结果
        EXTRA=""
        [ -n "$KEPT" ] && EXTRA="，保留本地配置${KEPT}"
        echo "SYNC_DETAIL=已同步上游提交 ${SYNC_CANDIDATE:0:7}（${SYNC_MODE} 合并，文件 ${SYNC_TOTAL} 个 / ${SYNC_BYTES} 字节${EXTRA}）" >> "$GITHUB_ENV"
        echo "- ${FORK}：完成 — 已同步上游提交 ${SYNC_CANDIDATE:0:7}（${SYNC_MODE} 合并，文件 ${SYNC_TOTAL} 个 / ${SYNC_BYTES} 字节${EXTRA}）" >> "$GITHUB_STEP_SUMMARY"
