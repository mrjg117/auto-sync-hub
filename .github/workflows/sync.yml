name: Upstream Auto Sync Hub

on:
  schedule:
    - cron: "47 16 * * *" # UTC 16:47，北京时间 00:47
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-sync-hub
  cancel-in-progress: false

jobs:
  prepare:
    name: 读取同步列表
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: targets
        run: |
          set -euo pipefail
          MATRIX=$(jq -c '{include: [
            .projects[]
            | select(.enabled != false)
            | {
                name: (.name // (.fork | split("/")[1])),
                fork: .fork,
                upstream: .upstream,
                branch: (.branch // ""),
                fork_branch: (.fork_branch // ""),
                key_files: (.key_files // ""),
                max_deleted: (.max_deleted // 50),
                max_delete_pct: (.max_delete_pct // 30),
                ci_gate: (.ci_gate // true)
              }
          ]}' projects.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sync:
    name: 同步 ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 执行同步
        uses: ./.github/actions/upstream-sync
        with:
          fork: ${{ matrix.fork }}
          upstream: ${{ matrix.upstream }}
          branch: ${{ matrix.branch }}
          fork-branch: ${{ matrix.fork_branch }}
          key-files: ${{ matrix.key_files }}
          max-deleted: ${{ matrix.max_deleted }}
          max-delete-pct: ${{ matrix.max_delete_pct }}
          ci-gate: ${{ matrix.ci_gate }}
          token: ${{ secrets.SYNC_PAT }}
          read-token: ${{ github.token }}
