name: Upstream Auto Sync Hub

on:
  schedule:
    - cron: "47 16 * * *" # UTC 16:47，北京时间 00:47
  workflow_dispatch:

permissions:
  contents: write # 写日志与改名回写 projects.json

concurrency:
  group: auto-sync-hub
  cancel-in-progress: false

jobs:
  prepare:
    name: 读取同步列表
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: targets
        run: |
          set -euo pipefail
          MATRIX=$(jq -c '{include: [
            .projects[]
            | select(.enabled != false)
            | {
                name: (.name // (.fork | split("/")[1])),
                fork: .fork,
                upstream: .upstream,
                branch: (.branch // ""),
                fork_branch: (.fork_branch // ""),
                key_files: (.key_files // ""),
                max_deleted: (.max_deleted // 50),
                max_delete_pct: (.max_delete_pct // 30),
                ci_gate: (.ci_gate // true),
                follow_rename: (.follow_rename // false)
              }
          ]}' projects.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sync:
    name: 同步 ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 执行同步
        uses: ./.github/actions/upstream-sync
        with:
          fork: ${{ matrix.fork }}
          upstream: ${{ matrix.upstream }}
          branch: ${{ matrix.branch }}
          fork-branch: ${{ matrix.fork_branch }}
          key-files: ${{ matrix.key_files }}
          max-deleted: ${{ matrix.max_deleted }}
          max-delete-pct: ${{ matrix.max_delete_pct }}
          ci-gate: ${{ matrix.ci_gate }}
          follow-rename: ${{ matrix.follow_rename }}
          token: ${{ secrets.SYNC_PAT }}
          read-token: ${{ github.token }}

      - name: 记录日志并回写改名
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_UPSTREAM: ${{ matrix.upstream }}
          FORK: ${{ matrix.fork }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          RESULT="${SYNC_RESULT:-}"
          # 仅"完成/错误"记日志；跳过（无更新、CI 未过、改名待确认）不写
          if [ "$RESULT" != "ok" ] && [ "$RESULT" != "error" ]; then
            echo "result=${RESULT:-空}，无需记录"
            exit 0
          fi

          # 通过 Contents API 读写文件：读时取 sha，写时带 sha（不匹配则 409 重试）
          # 并行 job 同时追加同一文件时靠 sha 乐观锁串行化，不丢行
          api_get() {  # 输出 "sha<TAB>base64内容"，文件不存在返回 1
            local resp
            resp=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=main" 2>/dev/null) || return 1
            printf '%s\t%s' "$(printf '%s' "$resp" | jq -r '.sha')" \
              "$(printf '%s' "$resp" | jq -r '.content' | tr -d '\n')"
          }
          api_put() {  # $1=path $2=base64 $3=message $4=sha(可空)
            local args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" -f message="$3" -f content="$2" -f branch=main)
            [ -n "$4" ] && args+=(-f sha="$4")
            gh api "${args[@]}" >/dev/null 2>&1
          }

          # ---- 追加统一日志 logs/sync.log ----
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$RESULT" = "ok" ]; then
            LINE="${TS} | 完成 | ${FORK} | ${SYNC_DETAIL:-同步成功}"
          else
            LINE="${TS} | 错误 | ${FORK} | ${SYNC_ERROR:-未知错误}"
          fi
          OK=0
          for i in $(seq 1 10); do
            SHA=""; OLD_B64=""
            if GOT=$(api_get "logs/sync.log"); then
              SHA="${GOT%%$'\t'*}"; OLD_B64="${GOT#*$'\t'}"
            fi
            OLD=""
            [ -n "$OLD_B64" ] && OLD=$(printf '%s' "$OLD_B64" | base64 -d)
            # 直接管道编码，避免命令替换吞掉末尾换行导致行粘连
            if [ -n "$OLD" ]; then
              ENCODED=$(printf '%s\n%s\n' "${OLD%$'\n'}" "$LINE" | base64 -w0)
            else
              ENCODED=$(printf '%s\n' "$LINE" | base64 -w0)
            fi
            if api_put "logs/sync.log" "$ENCODED" "log: ${NAME} (${RESULT})" "$SHA"; then
              OK=1; break
            fi
            sleep 2
          done
          [ "$OK" -eq 1 ] && echo "日志已写入 logs/sync.log" || echo "::warning::${FORK}: 日志写入失败"

          # ---- 改名跟随成功：回写 projects.json 的 upstream ----
          if [ -n "${SYNC_RENAMED_TO:-}" ] && [ "$RESULT" = "ok" ]; then
            OK=0
            for i in $(seq 1 10); do
              GOT=$(api_get "projects.json") || { sleep 2; continue; }
              SHA="${GOT%%$'\t'*}"; OLD_B64="${GOT#*$'\t'}"
              OLD=$(printf '%s' "$OLD_B64" | base64 -d)
              NEW=$(printf '%s' "$OLD" | jq --arg fork "$FORK" --arg new "$SYNC_RENAMED_TO" \
                '(.projects[] | select(.fork == $fork) | .upstream) = $new')
              if api_put "projects.json" "$(printf '%s' "$NEW" | base64 -w0)" "chore: follow rename ${FORK}" "$SHA"; then
                echo "已回写 upstream: ${OLD_UPSTREAM} -> ${SYNC_RENAMED_TO}"; OK=1; break
              fi
              sleep 2
            done
            [ "$OK" -eq 1 ] || echo "::warning::${FORK}: 改名回写失败"
          fi
