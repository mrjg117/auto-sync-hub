name: Upstream Auto Sync Hub

on:
  schedule:
    - cron: "47 16 * * *" # UTC 16:47，北京时间 00:47
  workflow_dispatch:

permissions:
  contents: write # 写日志与改名回写 projects.json

concurrency:
  group: auto-sync-hub
  cancel-in-progress: false

jobs:
  prepare:
    name: 读取同步列表
    runs-on: ubuntu-latest
    permissions:
      contents: write # 自动维护 projects.json 的项目列表
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: targets
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          HUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTO=$(jq -r '.auto_discover // false' projects.json)

          # 1) 自动发现：扫描账号下所有 fork，取直接 parent 作为 upstream
          DISCOVERED='[]'
          if [ "$AUTO" = "true" ]; then
            RAW=$(GH_TOKEN="$SYNC_PAT" gh api --paginate "user/repos?type=owner&per_page=100" \
              --jq '[.[] | select(.fork == true) | .full_name]' | jq -s 'if length==0 then [] else add end' 2>/dev/null || echo '[]')
            # 逐个取 parent.full_name（list 接口不返回 parent），按 fork 名排序保证列表稳定
            DISCOVERED=$(jq -r '.[]' <<< "$RAW" | while read -r f; do
              [ -z "$f" ] && continue
              P=$(GH_TOKEN="$SYNC_PAT" gh api "repos/${f}" --jq '.parent.full_name // empty' 2>/dev/null || true)
              [ -n "$P" ] && printf '%s\t%s\n' "$f" "$P"
            done | jq -R -s 'split("\n") | map(select(length>0) | split("\t") | {fork: .[0], upstream: .[1]}) | sort_by(.fork)')
            echo "自动发现 fork: $(jq -c 'map(.fork)' <<< "$DISCOVERED")"
          fi

          # 合并规则：以扫描结果为目标源，用户在该 fork 上已设的参数（skip/protected_files 等）全部保留
          merge_projects() {  # $1=扫描结果 $2=用户现有列表
            jq -c --argjson disc "$1" --argjson cur "$2" --arg auto "$AUTO" '
              if $auto == "true"
              then [ $disc[] | . as $d
                     | (([$cur[] | select(.fork == $d.fork)] | first) // {}) as $m
                     | $d + $m ]
              else $cur end
            ' <<< '{}'
          }

          # 2) 读远程 projects.json（拿最新内容 + sha），写回完整项目列表
          #    fork 增删自动反映到配置；手动设的参数/skip 不丢
          GOT=$(GH_TOKEN="$HUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/contents/projects.json?ref=main")
          SHA=$(printf '%s' "$GOT" | jq -r '.sha')
          REMOTE=$(printf '%s' "$GOT" | jq -r '.content' | base64 -d)
          CUR=$(printf '%s' "$REMOTE" | jq -c '.projects // []')
          NEW=$(merge_projects "$DISCOVERED" "$CUR")

          if [ "$NEW" != "$CUR" ]; then
            UPDATED=$(printf '%s' "$REMOTE" | jq --argjson p "$NEW" '.projects = $p')
            GH_TOKEN="$HUB_TOKEN" gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/projects.json" \
              -f message="chore: 自动维护 fork 同步列表" \
              -f content="$(printf '%s' "$UPDATED" | base64 -w0)" \
              -f branch=main -f sha="$SHA" >/dev/null
            echo "已写回项目列表（$(jq 'length' <<< "$NEW") 个）: $(jq -c 'map(.fork)' <<< "$NEW")"
          else
            echo "项目列表无变化"
          fi

          # 3) 生成 matrix（skip/enabled=false 的不参与同步）
          MATRIX=$(jq -c --argjson ps "$NEW" '
            [ $ps[]
              | select(.skip != true and .enabled != false)
              | {
                  name: (.name // (.fork | split("/")[1])),
                  fork: .fork,
                  upstream: .upstream,
                  branch: (.branch // ""),
                  fork_branch: (.fork_branch // ""),
                  key_files: (.key_files // ""),
                  protected_files: (.protected_files // ""),
                  max_deleted: (.max_deleted // 50),
                  max_delete_pct: (.max_delete_pct // 30),
                  ci_gate: (.ci_gate // true),
                  follow_rename: (.follow_rename // false)
                }
            ] | {include: .}
          ' <<< '{}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "targets=$(jq -c 'map(.fork)' <<< "$NEW")" >> "$GITHUB_OUTPUT"

  sync:
    name: 同步 ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 执行同步
        uses: ./.github/actions/upstream-sync
        with:
          fork: ${{ matrix.fork }}
          upstream: ${{ matrix.upstream }}
          branch: ${{ matrix.branch }}
          fork-branch: ${{ matrix.fork_branch }}
          key-files: ${{ matrix.key_files }}
          protected-files: ${{ matrix.protected_files }}
          max-deleted: ${{ matrix.max_deleted }}
          max-delete-pct: ${{ matrix.max_delete_pct }}
          ci-gate: ${{ matrix.ci_gate }}
          follow-rename: ${{ matrix.follow_rename }}
          token: ${{ secrets.SYNC_PAT }}
          read-token: ${{ github.token }}

      - name: 记录日志并回写改名
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_UPSTREAM: ${{ matrix.upstream }}
          FORK: ${{ matrix.fork }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          RESULT="${SYNC_RESULT:-}"
          # 仅"完成/错误"记日志；跳过（无更新、CI 未过、改名待确认）不写
          if [ "$RESULT" != "ok" ] && [ "$RESULT" != "error" ]; then
            echo "result=${RESULT:-空}，无需记录"
            exit 0
          fi

          # 通过 Contents API 读写文件：读时取 sha，写时带 sha（不匹配则 409 重试）
          # 并行 job 同时追加同一文件时靠 sha 乐观锁串行化，不丢行
          api_get() {  # 输出 "sha<TAB>base64内容"，文件不存在返回 1
            local resp
            resp=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=main" 2>/dev/null) || return 1
            printf '%s\t%s' "$(printf '%s' "$resp" | jq -r '.sha')" \
              "$(printf '%s' "$resp" | jq -r '.content' | tr -d '\n')"
          }
          api_put() {  # $1=path $2=base64 $3=message $4=sha(可空)
            local args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/$1" -f message="$3" -f content="$2" -f branch=main)
            [ -n "$4" ] && args+=(-f sha="$4")
            gh api "${args[@]}" >/dev/null 2>&1
          }

          # ---- 追加统一日志 logs/sync.log ----
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$RESULT" = "ok" ]; then
            LINE="${TS} | 完成 | ${FORK} | ${SYNC_DETAIL:-同步成功}"
          else
            LINE="${TS} | 错误 | ${FORK} | ${SYNC_ERROR:-未知错误}"
          fi
          # 去重指纹：去掉时间戳后的 "状态 | 项目 | 详情"
          SIG_NEW="${LINE#* | }"
          OK=0; DUP=0
          for i in $(seq 1 10); do
            SHA=""; OLD_B64=""
            if GOT=$(api_get "logs/sync.log"); then
              SHA="${GOT%%$'\t'*}"; OLD_B64="${GOT#*$'\t'}"
            fi
            OLD=""
            [ -n "$OLD_B64" ] && OLD=$(printf '%s' "$OLD_B64" | base64 -d)
            # 相同问题（同项目+同状态+同详情）已记录过则不再重复，直到该项目状态/原因变化
            LAST=$(printf '%s\n' "$OLD" | grep -F " | ${FORK} | " | tail -n 1 || true)
            if [ -n "$LAST" ] && [ "${LAST#* | }" = "$SIG_NEW" ]; then
              DUP=1; OK=1; break
            fi
            # 直接管道编码，避免命令替换吞掉末尾换行导致行粘连
            if [ -n "$OLD" ]; then
              ENCODED=$(printf '%s\n%s\n' "${OLD%$'\n'}" "$LINE" | base64 -w0)
            else
              ENCODED=$(printf '%s\n' "$LINE" | base64 -w0)
            fi
            if api_put "logs/sync.log" "$ENCODED" "log: ${NAME} (${RESULT})" "$SHA"; then
              OK=1; break
            fi
            sleep 2
          done
          if [ "$DUP" -eq 1 ]; then
            echo "与上次记录相同，跳过重复日志：${SIG_NEW}"
          elif [ "$OK" -eq 1 ]; then
            echo "日志已写入 logs/sync.log"
          else
            echo "::warning::${FORK}: 日志写入失败"
          fi

          # ---- 改名跟随成功：回写 projects.json 的 upstream ----
          if [ -n "${SYNC_RENAMED_TO:-}" ] && [ "$RESULT" = "ok" ]; then
            OK=0
            for i in $(seq 1 10); do
              GOT=$(api_get "projects.json") || { sleep 2; continue; }
              SHA="${GOT%%$'\t'*}"; OLD_B64="${GOT#*$'\t'}"
              OLD=$(printf '%s' "$OLD_B64" | base64 -d)
              NEW=$(printf '%s' "$OLD" | jq --arg fork "$FORK" --arg new "$SYNC_RENAMED_TO" \
                '(.projects[] | select(.fork == $fork) | .upstream) = $new')
              if api_put "projects.json" "$(printf '%s' "$NEW" | base64 -w0)" "chore: follow rename ${FORK}" "$SHA"; then
                echo "已回写 upstream: ${OLD_UPSTREAM} -> ${SYNC_RENAMED_TO}"; OK=1; break
              fi
              sleep 2
            done
            [ "$OK" -eq 1 ] || echo "::warning::${FORK}: 改名回写失败"
          fi
